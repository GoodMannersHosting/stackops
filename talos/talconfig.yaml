patches:
- |-
  - op: add
    path: /machine/kubelet/extraConfig
    value: 
      maxPods: 150
- |-
  - op: add
    path: /machine/sysctls
    value:
      vm.max_map_count: 524288
      fs.file-max: 131072
      fs.inotify.max_user_watches: 1048576
      fs.inotify.max_user_instances: 8192
      net.core.default_qdisc: fq             # 10Gb/s
      net.core.rmem_max: 67108864            # 10Gb/s | Cloudflared / QUIC
      net.core.wmem_max: 67108864            # 10Gb/s | Cloudflared / QUIC
      net.ipv4.tcp_congestion_control: bbr   # 10Gb/s
      net.ipv4.tcp_fastopen: 3               # Send and accept data in the opening SYN packet
      net.ipv4.tcp_mtu_probing: 1            # 10Gb/s | Jumbo frames
      net.ipv4.tcp_rmem: 4096 87380 33554432 # 10Gb/s
      net.ipv4.tcp_wmem: 4096 65536 33554432 # 10Gb/s
      net.ipv4.tcp_window_scaling: 1         # 10Gb/s
      net.ipv6.conf.all.forwarding: 1

- |-
  - op: add
    path: /machine/time
    value:
      servers: [time.cloudflare.com]
- |-
  - op: add
    path: /machine/features/hostDNS
    value:
      enabled: false
      resolveMemberNames: tru
      forwardKubeDNSToHost: false
- |-
  - op: add
    path: /machine/features
    value:
      stableHostname: true
      diskQuotaSupport: true
      rbac: true
      kubePrism:
        enabled: true
        port: 7445
- |-
  - op: add
    path: /cluster/proxy
    value:
      disabled: true

worker:
  schematic:
    customization:
      extraKernelArgs:
      - apparmor=0 # Less security, faster puter
      - init_on_alloc=0 # Less security, faster puter
      - init_on_free=0 # Less security, faster puter
      - intel_iommu=on # PCI Passthrough
      - iommu=pt # PCI Passthrough
      - mitigations=off # Less security, faster puter
      - security=none # Less security, faster puter
      - talos.auditd.disabled=1 # Less security, faster puter
  patches:
  - |-
    - op: add
      path: /machine/kubelet/nodeIP
      value:
        validSubnets: [172.20.0.0/22]

controlPlane:
  schematic: {}
  patches:
  - |-
    - op: add
      path: /machine/kubelet/extraArgs
      value:
        rotate-server-certificates: true
        rotate-certificates: true
  - |-
    - op: add
      path: /cluster/coreDNS
      value:
        disabled: true
  - |-
    - op: remove
      path: /cluster/apiServer/admissionControl
  - |-
    - op: add
      path: /cluster/apiServer/extraArgs
      value:
        enable-aggregator-routing: true
  - |-
    - op: add
      path: /cluster/controllerManager/extraArgs
      value:
        bind-address: 0.0.0.0
  - |-
    - op: add
      path: /cluster/scheduler/extraArgs
      value:
        bind-address: 0.0.0.0
  - |-
    - op: add
      path: /machine/kubelet/nodeIP
      value:
        validSubnets: [172.20.0.0/22]
  - |-
    - op: add
      path: /cluster/etcd/advertisedSubnets
      value: [172.20.0.0/22]
  - |-
    - op: add
      path: /cluster/etcd/extraArgs
      value:
        listen-metrics-urls: http://0.0.0.0:2381
  - |-
    - op: add
      path: /machine/features/kubernetesTalosAPIAccess
      value:
        enabled: true
        allowedRoles:
          - os:admin
        allowedKubernetesNamespaces:
          - actions-runner-system
          - system-upgrade
