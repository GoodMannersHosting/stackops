clusterName: baremetal
talosVersion: v1.9.4
domain: cluster.local
kubernetesVersion: 1.32.2
endpoint: "https://baremetal.homelab.danmanners.com:6443"

clusterPodNets:
- 10.244.0.0/16
clusterSvcNets:
- 10.96.0.0/12

cniConfig:
  name: none

additionalApiServerCertSans: &certs
  - &vip 172.20.0.10
  - 127.0.0.1

additionalMachineCertSans: *certs

nodes:
# Control Plane Nodes
## Control Plane R32-1
- hostname: cp-r32-1.homelab.danmanners.com
  controlPlane: true
  installDisk: /dev/nvme2n1
  schematic:
    customization:
      systemExtensions:
        officialExtensions: &intelExtensions
          - siderolabs/binfmt-misc
          - siderolabs/i915
          - siderolabs/intel-ucode
          - siderolabs/kata-containers
          - siderolabs/util-linux-tools
  ipAddress: 172.20.1.1
  disableSearchDomain: true
  nameservers: &nameservers
    - 172.22.0.1
    - 172.20.0.1
    - 10.3.0.1
  networkInterfaces:
  # Parent Interfaces set MTU to 8972
  - interface: enp91s0
    dhcp: false
    ignore: false
    mtu: &linux_jumbo_frames 8972
  - interface: enp3s0f0np0
    dhcp: false
    ignore: false
    mtu: *linux_jumbo_frames
  - interface: enp3s0f1np1
    dhcp: false
    ignore: false
    mtu: *linux_jumbo_frames
  # Bridge Interfaces
  - interface: br_mgmt
    dhcp: false
    mtu: *linux_jumbo_frames
    addresses:
    - 172.20.1.1/22
    routes:
    - network: 10.3.0.0/24
      gateway: &mgmt_gateway 172.20.0.1
    - network: 0.0.0.0/0
      gateway: *mgmt_gateway
      metric: 1024
    vip:
      ip: *vip
    bridge:
      stp:
        enabled: false
      interfaces:
      - enp91s0
  - interface: br_storage
    dhcp: false
    mtu: *linux_jumbo_frames
    addresses:
    - 172.20.33.1/20
    bridge:
      stp:
        enabled: false
      interfaces:
      - enp3s0f0np0
  - interface: bond_vxlan
    dhcp: false
    mtu: *linux_jumbo_frames
    bond:
      interfaces:
      - enp3s0f1np1
      mode: 802.3ad
      lacpRate: fast
      miimon: 100
      updelay: 200
      downdelay: 200
    # Neutron VLAN Interfaces
    vlans: &vlan_config
      - vlanId: &neutron_vlan 501
        dhcp: false
        mtu: &linux_vlan_jumbo_frames 8900
      - vlanId: &octavia_vlan 601
        dhcp: false
        mtu: *linux_vlan_jumbo_frames
  - interface: br.vxlan
    routes:
    - network: 0.0.0.0/0
      gateway: 172.22.0.1
      metric: 100
    dhcp: false
    mtu: *linux_jumbo_frames
    addresses:
    - 172.22.1.1/16
    bridge:
      stp:
        enabled: false
      interfaces:
      - bond_vxlan
    vlans: *vlan_config
  - interface: enp88s0
    dhcp: false
    ignore: true
