autoDirectNodeRoutes: true
bandwidthManager:
  enabled: true
  bbr: true
bpf:
  masquerade: false
  # hostLegacyRouting: true
  lbExternalClusterIP: true
  datapathMode: netkit
  preallocateMaps: true
  tproxy: true
bgpControlPlane:
  enabled: true
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
cluster:
  id: 1
  name: baremetal
devices: br.vxlan
egressGateway:
  enabled: false
enableIPv4BIGTCP: true
endpointRoutes:
  enabled: true
envoy:
  enabled: false
hubble:
  enabled: false
ipam:
  mode: kubernetes
  operator:
    clusterPoolIPv4PodCIDRList: [ "10.244.0.0/16" ]
    clusterPoolIPv4PodCIDRMaskSize: 23
ipv4NativeRoutingCIDR: 10.244.0.0/16
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
l2announcements:
  enabled: true
loadBalancer:
  algorithm: maglev
  mode: dsr
localRedirectPolicy: true
# MTU: 8850
operator:
  replicas: 2
  rollOutPods: true
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
  dashboards:
    enabled: true
prometheus:
  enabled: false
dashboards:
  enabled: false
rollOutCiliumPods: true
routingMode: native
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    - PERFMON
    - BPF
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE
