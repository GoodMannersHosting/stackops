monitoring:
  enabled: false
  createPrometheusRules: false # TODO: Enable this later
  # ingress:
  # dashboard: TODO: Later
  #   ingressClassName: internal
  #   host:
  #     name: rook.
  #     path: /
toolbox:
  enabled: true
cephClusterSpec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.1-20250202
  cephConfig:
    global:
      bdev_enable_discard: "true" # quote
      bdev_async_discard_threads: "1" # quote
      osd_class_update_on_start: "true" # quote
      device_failure_prediction_mode: local # requires mgr module
    # mgr:
    #   mgr/crash/warn_recent_interval: "7200" # 2h
  crashCollector:
    disable: false
  csi:
    readAffinity:
      enabled: true
  dashboard:
    enabled: false
    urlPrefix: /
    ssl: false
    prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
  mgr:
    modules:
    - name: diskprediction_local
      enabled: true
    - name: insights
      enabled: true
    - name: pg_autoscaler
      enabled: true
    - name: rook
      enabled: true
  network:
    provider: host
    addressRanges:
      cluster: &net [ 172.20.32.0/20 ]
      public: *net
    connections:
      requireMsgr2: true
  storage:
    useAllNodes: true
    useAllDevices: true
    config:
      osdsPerDevice: "1"
  resources:
    mgr:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    mon:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
    host:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 6Gi
    mgr-sidecar:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
cephBlockPools:
- name: &nvme nvme
  spec:
    deviceClass: nvme
    failureDomain: osd
    replicated:
      size: 1
  storageClass:
    enabled: true
    name: *nvme
    isDefault: false
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    mountOptions: [ "discard" ]
    parameters:
      imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
      csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
      csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
      csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
      csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
      csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
      csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
      csi.storage.k8s.io/fstype: ext4
cephFileSystems:
- name: &cfs cephfs
  spec:
    dataPools:
    - deviceClass: hdd
      failureDomain: osd
      replicated:
        size: 3
    metadataPool:
      replicated:
        size: 1
    metadataServer:
      activeCount: 1
      activeStandby: true
      priorityClassName: system-cluster-critical
  storageClass:
    enabled: true
    name: *cfs
    pool: hdd
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    parameters:
      fsName: cephfs
      pool: hdd
      csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
      csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
      csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
      csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
      csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
      csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
      csi.storage.k8s.io/fstype: ext4
