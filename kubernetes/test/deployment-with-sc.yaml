apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: docker.io/library/nginx:latest
        volumeMounts:
        - name: ephemeral-storage
          mountPath: /opt
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
      volumes:
      - name: ephemeral-storage
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: [ "ReadWriteOnce" ]
              storageClassName: "nvme"
              resources:
                requests:
                  storage: 1Gi
